services:
  postgres:
    image: postgres:16-alpine
    container_name: veritygrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: veritygrid
      POSTGRES_USER: veritygrid
      POSTGRES_PASSWORD: veritygrid_local_only
    ports:
      - "5432:5432"
    volumes:
      - veritygrid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritygrid -d veritygrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: veritygrid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - veritygrid_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  veritygrid_postgres_data:
  veritygrid_redis_data:
