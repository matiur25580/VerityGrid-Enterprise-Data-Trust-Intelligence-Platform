name: Capture dashboard showcase

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed demo application's base URL
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: showcase-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Validate showcase secrets
        env:
          SHOWCASE_EMAIL: ${{ secrets.DEMO_EMAIL }}
          SHOWCASE_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          test -n "$SHOWCASE_EMAIL" || (echo "::error::Add DEMO_EMAIL in repository Actions secrets." && exit 1)
          test -n "$SHOWCASE_PASSWORD" || (echo "::error::Add DEMO_PASSWORD in repository Actions secrets." && exit 1)
      - name: Capture real dashboard screenshots
        env:
          SHOWCASE_BASE_URL: ${{ inputs.base_url }}
          SHOWCASE_EMAIL: ${{ secrets.DEMO_EMAIL }}
          SHOWCASE_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: node scripts/capture-showcase.mjs
      - name: Verify all 12 screenshots
        shell: bash
        run: |
          set -euo pipefail
          test -s "docs/screenshots/01-executive-overview.png"
          test -s "docs/screenshots/02-data-catalog.png"
          test -s "docs/screenshots/03-data-contracts.png"
          test -s "docs/screenshots/04-data-lineage.png"
          test -s "docs/screenshots/05-quality-center.png"
          test -s "docs/screenshots/06-incident-response.png"
          test -s "docs/screenshots/07-governance-approvals.png"
          test -s "docs/screenshots/08-notification-deliveries.png"
          test -s "docs/screenshots/09-reliability-overview.png"
          test -s "docs/screenshots/10-reliability-trends.png"
          test -s "docs/screenshots/11-freshness-sla.png"
          test -s "docs/screenshots/12-evidence-insights.png"
          test "$(find docs/screenshots -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 12
      - name: Commit verified screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged; no commit required."
          else
            git commit -m "docs: publish verified dashboard showcase screenshots"
            git push
          fi
